name: Tests

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, gd, exif, intl, bcmath, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      # phpunit.xml supplies APP_KEY and an in-memory database; no .env needed.
      - run: php artisan test --compact

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
